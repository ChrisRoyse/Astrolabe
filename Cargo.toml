[workspace]
resolver = "2"
members = ["crates/*"]
# calyx/ and cbm/ are deliberately EXCLUDED from the root workspace (they carry
# their own `[workspace]` + profiles; see the profile note below and #286). The
# Astrolabe crates reach the calyx crates only as path-dependencies, so the
# calyx crates resolve in their own workspace graph, not the root's.
#
# Dual-workspace boundary (#298): a targeted check of a calyx crate should run
# against the owning workspace via `--manifest-path`, e.g.
#     cargo check -p calyx-ward --manifest-path calyx/Cargo.toml
exclude = [
    "calyx",
    "cbm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/ChrisRoyse/Astrolabe"
publish = false

[workspace.dependencies]
toml = "0.8"
astrolabe-anchors = { path = "crates/astrolabe-anchors" }
astrolabe-assay = { path = "crates/astrolabe-assay" }
astrolabe-domain = { path = "crates/astrolabe-domain" }
astrolabe-fleet = { path = "crates/astrolabe-fleet" }
astrolabe-ingest = { path = "crates/astrolabe-ingest" }
astrolabe-kernel = { path = "crates/astrolabe-kernel" }
astrolabe-lower = { path = "crates/astrolabe-lower" }
astrolabe-oracle = { path = "crates/astrolabe-oracle" }
astrolabe-panel = { path = "crates/astrolabe-panel" }
astrolabe-provenance = { path = "crates/astrolabe-provenance" }
astrolabe-weave = { path = "crates/astrolabe-weave" }
cbm-sys = { path = "crates/cbm-sys" }
calyx-aster = { path = "calyx/crates/calyx-aster" }
calyx-assay = { path = "calyx/crates/calyx-assay" }
calyx-core = { path = "calyx/crates/calyx-core" }
calyx-forge = { path = "calyx/crates/calyx-forge", features = ["cuda"] }
calyx-ledger = { path = "calyx/crates/calyx-ledger" }
calyx-lodestar = { path = "calyx/crates/calyx-lodestar" }
calyx-loom = { path = "calyx/crates/calyx-loom" }
calyx-paths = { path = "calyx/crates/calyx-paths" }
calyx-sextant = { path = "calyx/crates/calyx-sextant" }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

# ── Dev profile: debuginfo tuning (issue #188) ──────────────────────────────
# Mirrors calyx/Cargo.toml, which is silently ignored here: Cargo reads
# profiles only from the workspace root being built, and calyx/ is an
# excluded path-dep tree. Upstream Calyx measured the cargo default (debug = 2,
# full DWARF) at ~280 MB per dev executable and a ~190 GB shared target/;
# this workspace re-creates target/ from cold every FSV build, so full DWARF
# multiplies the cost of the mandated wipe. `line-tables-only` keeps function
# names + file:line in panic backtraces — everything the `cargo check`/`cargo
# build` FSV path actually consumes — while cutting object size and link time.
# Declared knob per standing invariant 4; measured before/after on #188.
[profile.dev]
debug = "line-tables-only"

# Dependencies (incl. the calyx path-dep crates) are never stepped into
# during build/FSV work; dropping their debuginfo is the largest target/-size
# win with zero loss of first-party debuggability.
[profile.dev.package."*"]
debug = false

# Build scripts and proc-macros run at build time and are never debugged
# interactively; no debuginfo needed.
[profile.dev.build-override]
debug = false
