[package]
name = "calyx-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The neural embedding runtimes (candle-local BERT, ONNX/fastembed, qwen3,
# static-lookup) pull in the heavy ML stack — `ort` (ONNX Runtime bindings),
# `fastembed` (which drags `candle`), `candle-{core,nn,transformers}`, and
# `tokenizers[onig]` (Oniguruma C build) — plus the `hf-hub` downloader and
# `memmap2`. They are OFF by default (#297): Astrolabe reaches calyx-registry
# only through `SwapController` (no embedding runtime), so this ML payload is
# dead weight in the default `astrolabe-server` graph. Enable `ml-runtime` in a
# consumer that actually instantiates neural lenses; without it, the runtime
# constructors and contract derivations for those variants fail closed with
# CALYX_REGISTRY_ML_RUNTIME_DISABLED. Mirrors the #191 calyx-ward `onnx-lens`
# pattern.
ml-runtime = [
    "dep:calyx-onnx-runtime",
    "calyx-forge/cuda-runtime-boundary",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:fastembed",
    "dep:half",
    "dep:hf-hub",
    "dep:memmap2",
    "dep:ort",
    "dep:safetensors",
    "dep:tokenizers",
]
cuda = ["ml-runtime", "candle-cuda"]
candle-cuda = ["calyx-forge/cuda", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "fastembed/cuda"]

[dependencies]
calyx-assay = { path = "../calyx-assay" }
calyx-aster = { path = "../calyx-aster" }
calyx-core = { path = "../calyx-core" }
calyx-forge = { path = "../calyx-forge" }
calyx-ledger = { path = "../calyx-ledger" }
calyx-onnx-runtime = { path = "../calyx-onnx-runtime", features = ["runtime"], optional = true }
blake3.workspace = true
candle-core = { version = "=0.10.2", optional = true }
candle-nn = { version = "=0.10.2", optional = true }
candle-transformers = { version = "=0.10.2", optional = true }
fastembed = { version = "5.16.0", default-features = false, features = ["hf-hub-rustls-tls", "ort-alternative-backend", "qwen3"], optional = true }
half = { workspace = true, optional = true }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"], optional = true }
memmap2 = { workspace = true, optional = true }
onnx-rs.workspace = true
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "alternative-backend", "cuda", "api-24"], optional = true }
safetensors = { version = "=0.7.0", optional = true }
serde.workspace = true
# Receipt identities bind the exact serialized bytes.  Without the bit-exact
# parser, a persisted f32/f64 can move by one ULP during readback and make an
# otherwise valid receipt fail its mandatory parse/re-serialize byte check.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
sha1.workspace = true
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"], optional = true }
tracing.workspace = true

[dev-dependencies]
rusqlite.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
