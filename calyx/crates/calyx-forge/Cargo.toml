[package]
name = "calyx-forge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
cuda-runtime-boundary = ["dep:windows-sys"]
cuda = ["dep:cudarc", "cuda-runtime-boundary"]
cuda-policy-measurement = ["cuda"]
# Apple Silicon GPU backend. Opt-in because selecting it changes the numeric
# artifact: GPU reductions accumulate in tree order and do not reproduce the
# CPU backend bit-for-bit (see src/metal/mod.rs).
metal = ["dep:metal"]

[dependencies]
calyx-core = { path = "../calyx-core" }
cudarc = { workspace = true, optional = true, features = ["std", "driver", "cublas", "nvrtc", "dynamic-loading", "cuda-13030"] }
nvml-wrapper.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
wide.workspace = true

[build-dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# metal-rs: Metal compute for the Apple Silicon GPU backend (#895).
metal = { version = "0.33", optional = true }
