name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  pins:
    name: pins / subtree state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify vendor pins
        run: bash scripts/verify-pins.sh

      - name: Verify crate scaffold has no stub panics
        run: bash scripts/check-no-todo.sh

      - name: Verify unsafe boundary
        run: bash scripts/check-unsafe-boundary.sh

      - name: Verify Calyx path dependencies
        run: python3 scripts/check-calyx-path-deps.py

      - name: Verify aggregate and release gate wiring
        run: python3 scripts/check-gate-wiring.py

      - name: Summary
        run: |
          {
            echo "### Pin gate"
            echo
            echo "- Vendor tree pins matched VENDORED.md."
            echo "- Calyx dependencies resolved as local path deps."
            echo "- No todo!()/unimplemented!() in crates/."
            echo "- Unsafe Rust remained confined to astrolabe-bridge and cbm-sys."
          } >> "$GITHUB_STEP_SUMMARY"

  portable-gates:
    name: portable aggregate / linux
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install portable aggregate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev clang strace

      - name: Cache portable aggregate outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: portable-${{ runner.os }}-${{ hashFiles('VENDORED.md') }}-${{ hashFiles('Cargo.lock') }}

      - name: Run portable aggregate
        run: bash scripts/check.sh

  cbm-lint:
    name: cbm lint / clang-tidy cppcheck format
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install C lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev cmake cppcheck clang-tidy clang-format

      - name: Cache CBM lint intermediates
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vendor/codebase-memory-mcp/build
          key: cbm-lint-${{ runner.os }}-${{ hashFiles('VENDORED.md') }}-${{ hashFiles('vendor/codebase-memory-mcp/Makefile.cbm') }}

      - name: Run upstream CBM lint gate
        run: bash scripts/ci-cbm-lint.sh

  cbm-tests:
    name: cbm tests / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            shell: bash
          - label: linux-x64-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            shell: bash
          - label: macos-arm64-clang
            os: macos-14
            cc: cc
            cxx: c++
            shell: bash
          - label: windows-x64-mingw
            os: windows-latest
            cc: clang
            cxx: clang++
            shell: msys2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install C deps (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev clang

      - name: Install MinGW deps (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: CLANG64
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-compiler-rt
            mingw-w64-clang-x86_64-zlib
            make
            git
            coreutils

      - name: Cache CBM build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vendor/codebase-memory-mcp/build
          key: cbm-tests-${{ matrix.label }}-${{ hashFiles('VENDORED.md') }}-${{ hashFiles('vendor/codebase-memory-mcp/Makefile.cbm') }}

      - name: Run upstream CBM C suite
        if: matrix.shell == 'bash'
        run: bash scripts/ci-cbm-test.sh "${{ matrix.label }}" "${{ matrix.cc }}" "${{ matrix.cxx }}"

      - name: Run upstream CBM C suite
        if: matrix.shell == 'msys2'
        shell: msys2 {0}
        run: bash scripts/ci-cbm-test.sh "${{ matrix.label }}" "${{ matrix.cc }}" "${{ matrix.cxx }}"

  rust:
    name: rust / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - label: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
          - label: windows-x64-gnu
            os: windows-latest
            target: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Install Rust C deps (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev clang

      - name: Install MinGW linker (Windows GNU)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            make
            git

      - name: Install LLVM objcopy (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install Python for Calyx formatter metadata parsing
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2
        with:
          tool: cargo-nextest

      - name: Cache cargo registry and targets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            vendor/calyx/target
          key: rust-${{ matrix.label }}-${{ hashFiles('VENDORED.md') }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('vendor/calyx/Cargo.lock') }}

      - name: Run Astrolabe and Calyx Rust gates
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: bash scripts/ci-rust-gate.sh "${{ matrix.label }}" "${{ matrix.target }}"

  row-sink-benchmark:
    name: scheduled / row-sink overhead
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev clang

      - name: Cache benchmark build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: row-sink-${{ runner.os }}-${{ hashFiles('VENDORED.md') }}-${{ hashFiles('Cargo.lock') }}

      - name: Run measured row-sink overhead gate
        env:
          ASTROLABE_ROW_SINK_BENCH_WRITE_RELEASE_ARTIFACT: "1"
        run: bash scripts/bench-row-sink-overhead.sh

      - name: Upload row-sink benchmark artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: row-sink-overhead-${{ github.sha }}
          path: |
            target/astrolabe-row-sink-overhead-bench.json
            target/astrolabe-release-predicate/bench-ratios.json
          if-no-files-found: error
          retention-days: 30

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [pins, portable-gates, cbm-lint, cbm-tests, rust, row-sink-benchmark]
    if: ${{ always() }}
    steps:
      - name: Require every CI stage
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          optional_skips = {"row-sink-benchmark"} if os.environ["EVENT_NAME"] != "schedule" else set()
          bad = {
              name: data["result"]
              for name, data in needs.items()
              if data["result"] != "success"
              and not (data["result"] == "skipped" and name in optional_skips)
          }
          if bad:
              print(f"CI NOT OK: {bad}")
              sys.exit(1)
          print("CI OK: " + ", ".join(sorted(needs)))
          PY
