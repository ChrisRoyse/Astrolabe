[package]
name = "astrolabe-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
astrolabe-domain.workspace = true
cbm-sys.workspace = true
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
astrolabe-weave.workspace = true
calyx-aster.workspace = true
calyx-core.workspace = true
rusqlite = { version = "0.40.1", features = ["bundled"] }

[lib]
path = "src/lib.rs"
