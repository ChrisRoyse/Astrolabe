[package]
name = "astrolabe-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
manual-fsv = []

[dependencies]
astrolabe-anchors.workspace = true
astrolabe-assay.workspace = true
astrolabe-bridge = { path = "../astrolabe-bridge" }
astrolabe-domain.workspace = true
astrolabe-fleet.workspace = true
astrolabe-guard = { path = "../astrolabe-guard" }
astrolabe-ingest.workspace = true
astrolabe-kernel.workspace = true
astrolabe-lower.workspace = true
astrolabe-oracle.workspace = true
astrolabe-panel.workspace = true
astrolabe-provenance.workspace = true
astrolabe-weave.workspace = true
calyx-aster.workspace = true
calyx-assay.workspace = true
calyx-core.workspace = true
calyx-ledger.workspace = true
calyx-registry.workspace = true
cbm-sys.workspace = true
blake3 = "1"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
toml.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "astrolabe"
path = "src/main.rs"

[[bin]]
name = "codebase-memory-mcp"
path = "src/codebase_memory_mcp_shim.rs"

[[example]]
name = "issue_1127_empty_transaction_fsv"
required-features = ["manual-fsv"]

[[example]]
name = "issue_1099_cross_lsp_fsv"
required-features = ["manual-fsv"]

[[example]]
name = "issue_1134_causal_numeric_fsv"
required-features = ["manual-fsv"]

[[example]]
name = "issue_557_564_compression_mcp_fsv"
required-features = ["manual-fsv"]
