[package]
name = "astrolabe-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
astrolabe-bridge = { path = "../astrolabe-bridge" }
astrolabe-domain.workspace = true
astrolabe-guard = { path = "../astrolabe-guard" }
astrolabe-ingest.workspace = true
astrolabe-kernel.workspace = true
astrolabe-lower.workspace = true
astrolabe-panel.workspace = true
astrolabe-weave.workspace = true
calyx-aster.workspace = true
calyx-core.workspace = true
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "astrolabe"
path = "src/main.rs"
