[package]
name = "astrolabe-ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
astrolabe-domain.workspace = true
astrolabe-panel.workspace = true
calyx-aster.workspace = true
calyx-core.workspace = true
calyx-ledger.workspace = true
blake3 = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lib]
path = "src/lib.rs"

[dev-dependencies]
calyx-aster = { workspace = true, features = ["crash-fsv"] }
crc32fast = "1"
