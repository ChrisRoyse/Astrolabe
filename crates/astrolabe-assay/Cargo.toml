[package]
name = "astrolabe-assay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
astrolabe-domain.workspace = true
blake3 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes the JSON float parser bit-exact, so a ledgered card's
# f64 fields (bits, intervals, TC/n_eff, transfer entropy, …) read back identical
# to what was written — without it serde_json's fast parser can shift a value by
# one ULP and a legitimate read-back would fail the hash-chain integrity check.
serde_json = { version = "1", features = ["float_roundtrip"] }

[lib]
path = "src/lib.rs"
