[package]
name = "astrolabe-guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
astrolabe-domain.workspace = true
astrolabe-panel.workspace = true
calyx-core.workspace = true
sha2 = "0.10"

[lib]
path = "src/lib.rs"

# Test-only tree-sitter grammars for calibration parse verification. These are
# dev-dependencies: nothing in the shipped binary depends on them. Runtime
# parse-through-libcbm stays the guard_check path's concern.
[dev-dependencies]
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
