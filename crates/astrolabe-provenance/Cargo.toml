[package]
name = "astrolabe-provenance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
astrolabe-domain.workspace = true
# #67 / #40: reproduce mode re-executes the grounded kernel answer engine
# (`astrolabe_kernel::answer`) live against the current vault graph and compares
# the re-derivation to the recorded answer. No cycle: kernel depends on
# domain + panel, never on provenance.
astrolabe-kernel.workspace = true
blake3 = "1"

[dev-dependencies]
# Real ledger append/scan path used to build lineage FSV fixtures from persisted
# ledger rows (a disk-backed DirectoryLedgerStore), not hand-built structs. This
# is a test-only dependency: the production crate stays pure (domain + blake3),
# and the live vault-scan adapter lives server-side.
calyx-core.workspace = true
calyx-ledger.workspace = true

[lib]
path = "src/lib.rs"
