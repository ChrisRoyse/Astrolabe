# ASTROLABE cargo configuration.
#
# Intentionally empty of active settings.
#
# Primary host is macOS on Apple Silicon (aarch64-apple-darwin). The Rust host
# and the static `libcbm.a` archive must share one ABI; on this host both are
# arm64 Mach-O, produced by the same Xcode Command Line Tools clang that
# `crates/cbm-sys/build.rs` drives through `patches/cbm/Makefile.cbm`. Apple's
# ld64 is the only linker in that path and needs no flags from here.
#
# Do not add a `rustflags` key without measuring first (standing invariant 4:
# no constant that could be a measurement). Cargo treats CARGO_ENCODED_RUSTFLAGS,
# RUSTFLAGS, target rustflags, and build rustflags as MUTUALLY EXCLUSIVE sources
# — whichever wins silently discards the others. That is the trap the previous
# Windows-era contents of this file existed to document.
#
# Historical note: this file formerly carried a long analysis of ld.bfd vs
# ld.lld link times for the x86_64-pc-windows-gnu host. That host is no longer
# the evidence authority (see CLAUDE.md, owner directive 2026-08-01) and the
# pinned-LLVM bundle it depended on is gone, so the measurements no longer
# describe anything reachable. Git history retains them.
